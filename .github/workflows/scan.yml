name: scan
on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"   # every 5 min, US market hours (UTC)
    - cron: "0 */3 * * *"         # every 3 h otherwise
  workflow_dispatch:
concurrency: { group: scan, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python server.py --once out/scan.json
      - name: Publish to data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add scan.json
          git commit -qm "scan $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
